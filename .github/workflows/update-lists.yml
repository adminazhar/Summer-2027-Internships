name: Update job lists

# The 4-hourly refresh runs from cron on server 77 (/usr/local/bin/summer-2027-internships-update),
# because GitHub kept dropping scheduled runs. This workflow is only the manual "Run workflow" button.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the tables
        run: python .github/scripts/update_lists.py

      - name: Commit if anything changed
        run: |
          git config user.name "Azhar Khan"
          git config user.email "admin@azhark.com"
          git add README.md NEW_GRAD.md ENGINEERING_INTERNSHIPS.md BUSINESS_INTERNSHIPS.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update job lists ($(date -u +%Y-%m-%d))"
            git push
          fi
